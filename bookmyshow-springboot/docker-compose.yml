services:
  postgres:
    image: postgres:16-alpine
    container_name: bms-postgres
    environment:
      POSTGRES_DB: bookmyshow
      POSTGRES_USER: bms
      POSTGRES_PASSWORD: bms
    ports: ["5434:5432"]
    volumes: [bms-postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bms -d bookmyshow"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: bms-redis
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  bms-postgres-data:

server:
  port: 8080
spring:
  application:
    name: bookmyshow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/bookmyshow}
    username: ${DB_USERNAME:bms}
    password: ${DB_PASSWORD:bms}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jackson:
    serialization:
      write-dates-as-timestamps: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  jwt:
    # Replace with a base64-encoded secret of at least 256 bits in non-demo environments.
    secret: ${JWT_SECRET:VGhpc0lzQURlbW9uU2VjcmV0S2V5Rm9yQm9va015U2hvd0FwcGxpY2F0aW9uMTIzNDU2Nzg=}
    expiration-ms: 86400000
  booking:
    seat-lock-ttl-seconds: 300
